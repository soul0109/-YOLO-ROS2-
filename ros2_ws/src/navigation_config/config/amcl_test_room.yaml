# test_room AMCL + map_server（仅定位，不含 Nav2 规划）
# localization_launch.py 会覆盖 map_server.yaml_filename

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel

    # 粒子滤波
    min_particles: 800
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # 激光（对齐 robot_v0：min_range 0.30 m，test_room 尺度）
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.30
    max_beams: 60

    # 更新阈值（遥控验收：更勤更新）
    update_min_d: 0.05
    update_min_a: 0.10

    # 运动模型噪声（差速）
    alpha1: 0.05  # 4.5b: 0.2→0.05（T3 odom≪噪声模型；受控解冻）
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05

    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    tf_broadcast: true
    transform_tolerance: 0.5
    save_pose_rate: 0.5

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
